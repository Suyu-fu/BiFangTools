plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.148'
}

group = 'dev.waythread'
version = '0.5.8'
def modId = 'bifangtools'
def minecraftVersion = '26.1'
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = '26.1.0.19-beta'

    runs {
        client { client() }
    }

    mods {
        register(modId) { sourceSet sourceSets.main }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('jar', Jar) {
    archiveBaseName = 'bifangtools'
    archiveClassifier = "neoforge-mc${minecraftVersion}"
}

tasks.processResources {
    inputs.property('modId', modId)
    inputs.property('modVersion', project.version)
    inputs.property('minecraftVersion', minecraftVersion)
    from('LICENSE', 'LICENSE-ASSETS')
    filesMatching('META-INF/neoforge.mods.toml') {
        expand(modId: modId, modVersion: project.version, minecraftVersion: minecraftVersion)
    }
}
